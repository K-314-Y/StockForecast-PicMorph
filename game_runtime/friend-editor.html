<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>相棒アトリエ</title>
  <link rel="stylesheet" href="/friend/editor.css">
  <script type="module" src="/friend/editor.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <h1>相棒アトリエ</h1>
        <p>ちび相棒の姿と予測スタイルを育てよう。</p>
      </div>
      <div class="account" id="account" hidden>
        <span>口座 <b id="account-id"></b></span>
        <button type="button" id="logout" class="secondary">ログアウト</button>
      </div>
    </header>

    <p id="feedback" class="feedback" role="status"><span id="spinner" aria-hidden="true" hidden></span><span id="message"></span></p>

    <form id="login" class="card" aria-labelledby="login-title" autocomplete="off">
      <h2 id="login-title">招待でログイン</h2>
      <p>管理者から受け取った一度限りのコードを入力してください。</p>
      <label for="invite">招待コード</label>
      <input id="invite" type="password" autocomplete="off" spellcheck="false" maxlength="43" required disabled>
      <button id="login-button" type="submit" disabled>アトリエに入る</button>
      <noscript><p>ログインには JavaScript が必要です。</p></noscript>
    </form>

    <div id="workspace" class="workspace" hidden>
      <section id="preview" class="card preview" aria-labelledby="preview-title" hidden>
        <h2 id="preview-title">プレビュー</h2>
        <svg id="avatar" viewBox="0 0 280 280" aria-hidden="true">
          <circle cx="140" cy="129" r="100" fill="#fbf5ff"/>
          <path class="sparkle" d="M47 61q0 14 14 14-14 0-14 14 0-14-14-14 14 0 14-14ZM230 111q0 12 12 12-12 0-12 12 0-12-12-12 12 0 12-12ZM65 182q0 8 8 8-8 0-8 8 0-8-8-8 8 0 8-8Z"/>
          <ellipse cx="140" cy="250" rx="72" ry="13" fill="#cebdd9"/>
          <g class="chibi">
            <g class="ink" data-hair-color>
              <path class="part" data-hair="long" d="M76 103Q69 135 70 199q30 23 62 2l16 0q30 20 63-2 1-66-9-96Z"/>
              <path class="part" data-hair="twintails" d="M85 90q-28-15-42 11-17 31 3 85 27-2 34-41l16-43ZM195 90q28-15 42 11 17 31-3 85-27-2-34-41l-16-43Z"/>
              <path class="part" data-hair="bob" d="M77 101q-12 69 14 82 18-11 31-9h36q13-2 31 9 26-13 14-82Z"/>
            </g>
            <path class="ink" fill="#51445d" d="M112 223q-10 23-9 24h29l6-18 10 0 3 18h29l-9-24Z"/>
            <path class="ink" data-clothing-color d="M116 166q-25 12-34 40 5 8 19 8l9-12-4 27q32 14 68 0l-4-27 9 12q14 0 19-8-9-28-34-40Z"/>
            <path class="ink" fill="#fff8f3" d="M122 175l18 17 18-17"/>
            <path class="ink" fill="#ffdbca" d="M86 114q-18-4-14 15 3 14 16 12m106-27q18-4 14 15-3 14-16 12"/>
            <path class="ink" fill="#ffe4d5" d="M82 105q6-44 58-44t58 44v26q0 48-58 48t-58-48Z"/>
            <path class="ink" data-hair-color d="M80 130Q60 86 91 57q16-15 49-15 57 0 65 42 6 26-7 45l-13-30q-15 7-42-19-17 22-52 25Z"/>
            <path d="M90 80q12-22 36-25" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="5" stroke-linecap="round"/>
            <g fill="#f1a3a8"><ellipse cx="101" cy="140" rx="9" ry="4"/><ellipse cx="179" cy="140" rx="9" ry="4"/></g>
            <g class="part face" data-expression="cheerful">
              <path d="M107 128q7-10 14 0m38 0q7-10 14 0"/>
              <path fill="#ea8c93" d="M132 144h16q-8 15-16 0Z"/>
            </g>
            <g class="part face" data-expression="calm">
              <path d="M108 127h11m42 0h11m-37 20q5 4 10 0"/>
            </g>
            <g class="part face" data-expression="determined">
              <path d="M108 119l13 6m38 0 13-6m-55 7v5m46-5v5m-29 17q6-6 12 0"/>
            </g>
            <g class="part ink" data-accessory="ribbon" fill="#fb9dad">
              <path d="M181 70l-21-19-4 27 24-1 20 15 6-27-24 7Z"/>
              <circle cx="181" cy="73" r="6"/>
            </g>
            <path class="part ink" data-accessory="star" fill="#ffd477" d="M187 60l4 11 12 1-9 7 2 12-9-7-10 7 3-12-10-7 12-1Z"/>
            <g class="part ink" data-accessory="glasses" fill="none">
              <rect x="98" y="119" width="34" height="24" rx="10"/>
              <rect x="148" y="119" width="34" height="24" rx="10"/>
              <path d="M132 128q8-6 16 0"/>
            </g>
          </g>
        </svg>
        <p id="preview-name" class="preview-name"></p>
        <p>入力すると姿が変わります。</p>
      </section>

      <div id="editor">
        <p id="profile-error" class="panel-error" hidden></p>
        <div id="profile" class="forms" hidden>
          <form id="companion-form" class="card" aria-labelledby="companion-title" autocomplete="off">
            <h2 id="companion-title">相棒と戦略</h2>
            <p class="revision">保存版 <b id="companion-revision"></b></p>
            <fieldset id="companion-fields" disabled>
              <label for="companion-name">相棒の名前</label>
              <input id="companion-name" type="text" maxlength="32" required aria-describedby="name-hint">
              <p class="hint" id="name-hint">1〜16文字</p>
              <div class="colors">
                <div><label for="hair-color">髪色</label><input id="hair-color" type="color"></div>
                <div><label for="clothing-color">服の色</label><input id="clothing-color" type="color"></div>
              </div>
              <label for="approach">予測スタイル</label>
              <select id="approach">
                <option value="trend">値動きの流れに乗る</option>
                <option value="momentum">直近の勢いを追う</option>
                <option value="reversion">行き過ぎからの戻りを狙う</option>
                <option value="volatility">値動きの大きさを重視する</option>
              </select>
              <label for="risk">リスク配分 <output id="risk-value" for="risk" aria-live="off"></output></label>
              <input id="risk" type="range" min="5" max="100" step="5">
              <button id="save-companion" type="submit">相棒と戦略を保存</button>
            </fieldset>
            <p class="hint">戦略の変更は次回以降の予測候補に反映されます。</p>
            <p class="model">編集設定のモデル版 <span id="editable-version"></span></p>
          </form>

          <form id="look-form" class="card" aria-labelledby="look-title" autocomplete="off">
            <h2 id="look-title">外見パーツ</h2>
            <p class="revision">保存版 <b id="look-revision"></b></p>
            <fieldset id="look-fields" disabled>
              <label for="hair-style">髪型</label>
              <select id="hair-style"><option value="bob">ボブ</option><option value="long">ロング</option><option value="twintails">ツインテール</option></select>
              <label for="expression">表情</label>
              <select id="expression"><option value="cheerful">にっこり</option><option value="calm">おだやか</option><option value="determined">きりっと</option></select>
              <label for="accessory">アクセサリー</label>
              <select id="accessory"><option value="ribbon">リボン</option><option value="glasses">めがね</option><option value="star">星</option><option value="none">なし</option></select>
              <button id="save-look" type="submit">外見パーツを保存</button>
            </fieldset>
          </form>
        </div>
      </div>

      <section class="card mock" aria-labelledby="mock-title">
        <div class="mock-heading"><h2 id="mock-title">模擬記録</h2><span>MOCK_NONLIVE</span></div>
        <dl>
          <div><dt>ポケット財布</dt><dd id="wallet"></dd></div>
          <div><dt>模擬予測</dt><dd id="forecast"></dd></div>
          <div id="frozen" hidden><dt>確定予測のモデル版</dt><dd id="frozen-version" class="model"></dd></div>
        </dl>
      </section>
    </div>
  </main>
</body>
</html>
