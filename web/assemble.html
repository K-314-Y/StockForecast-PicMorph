<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>パーツ工房 · Creature Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#edf5ff;background:#101925}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:24px 16px}nav{display:flex;flex-wrap:wrap;gap:16px}a{color:#96e8df}h1{font-size:clamp(26px,6vw,40px);margin-bottom:8px}p{color:#bccbdc;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}.card{padding:18px;border:1px solid #395063;border-radius:18px;background:linear-gradient(135deg,#203346,#172433);min-width:0}.card:has(input:checked){border-color:#8de2ca;box-shadow:inset 0 3px #8de2ca}label{display:block;margin:10px 0}input,select,button{font:inherit;max-width:100%}input:not([type=checkbox]),select{width:100%;padding:10px;border-radius:8px;border:1px solid #506679;background:#101e2a;color:inherit}input[type=range]{padding:0;accent-color:#95e5ce}button{padding:12px 18px;border:0;border-radius:12px;background:#9be8d1;color:#102a2a;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}h2{font-size:20px;margin-top:26px}#status,#result{overflow-wrap:anywhere}progress{width:100%;accent-color:#9be8d1}small{color:#bcd0df}.tag{font-size:12px;letter-spacing:.15em;color:#9be8d1}output{float:right}
</style>
<main><nav><a href="/create">制作ギャラリー・架空データ学習</a><a href="/game">ゲームへ</a></nav>
<p class="tag">CREATURE LAB / PARTS WORKSHOP</p><h1>きみだけの観測チームを組もう</h1><p>コアを選び、2〜4個の分析パーツを仲間に。配分のバランスで、架空の景色の見え方が変わります。</p>
<form id="builder"><div class="grid"><section class="card"><label>キャラクター名<input id="name" maxlength="60" required value="星の観測隊"></label><label>設定・コンセプト（任意）<input id="concept" maxlength="300" placeholder="静かな湖を旅する観測チーム"></label><small>名前・設定・外見は予測計算に使いません。</small></section><section class="card"><label>観測期間コア<select id="window"></select></label><label>仮想配分コア<select id="risk"></select></label><small>仮想配分比率は予測確率を変えません。</small></section></div>
<h2>分析パーツ <small>／ 2〜4個装備</small></h2><div id="indicators" class="grid"></div><div class="actions"><button id="preview" type="submit" disabled>組み立てて試す ✦</button><button id="save" type="button" disabled>DRAFTを保存</button></div></form>
<p id="status" role="status" aria-live="polite">パーツを読み込み中…</p><section id="result" hidden></section><p>固定架空データでの設計演習です。実相場での精度・優位性は示しません。DRAFT保存後、ギャラリーで学習演習へ進めます。</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let revision=0,ready=null,busy=false,cards=[];
async function api(path,payload){const r=await fetch(path,payload?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'処理できませんでした');return d}
function invalidate(){revision++;ready=null;$('save').disabled=true;$('result').hidden=true;$('status').textContent='配分を編集したら、もう一度組み立てて試してください。'}
function payload(){return {name:$('name').value,concept:$('concept').value,window_part_id:$('window').value,risk_part_id:$('risk').value,analysis:cards.filter(c=>c.on.checked).map(c=>({part_id:c.part.part_id,share:Number(c.share.value),strength:Number(c.strength.value)}))}}
function element(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
function render(data){const root=$('result');root.replaceChildren();element('h2','組み立て完了 · 合計100%',root);const grid=element('div','',root);grid.className='grid';for(const [id,w] of Object.entries(data.compiled.engine_parameters.plugin_weights)){const card=element('div','',grid);card.className='card';element('strong',cards.find(c=>c.part.config.indicator_id===id).part.name+' '+w+'%',card);const bar=element('progress','',card);bar.max=100;bar.value=w;}element('h2','3つの架空の景色で試す',root);for(const f of data.fixtures){element('p',f.name+' → '+f.predicted+' ｜ '+Object.entries(f.probabilities).map(([k,v])=>k+' '+(v*100).toFixed(1)+'%').join(' / '),root);}element('small',data.notice,root);root.hidden=false}
$('builder').addEventListener('input',invalidate);$('builder').addEventListener('change',invalidate);
$('builder').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const version=revision, p=payload();busy=true;$('preview').disabled=true;$('save').disabled=true;try{const d=await api('/api/parts/preview',p);if(version===revision){ready=p;render(d);$('status').textContent='チーム完成！この設計を下書きに残せます。';$('save').disabled=false}}catch(e){$('status').textContent=e.message}finally{busy=false;$('preview').disabled=false}});
$('save').addEventListener('click',async()=>{if(busy||!ready)return;const p=ready;busy=true;$('save').disabled=true;$('preview').disabled=true;try{await api('/api/parts/draft',p);invalidate();$('status').textContent='DRAFTを保存しました。制作ギャラリーから確認・学習できます。'}catch(e){$('status').textContent=e.message;if(ready===p)$('save').disabled=false}finally{busy=false;$('preview').disabled=false}});
(async()=>{try{const d=await api('/api/parts/catalog');for(const part of d.parts){if(part.kind!=='builtin_indicator'){const select=$(part.kind);const o=element('option',part.name+' — '+part.explanation,select);o.value=part.part_id;o.selected=['window:balanced','risk:normal'].includes(part.part_id);continue}const card=element('section','',$('indicators'));card.className='card';const label=element('label','',card),on=document.createElement('input');on.type='checkbox';on.checked=cards.length<2;label.append(on,document.createTextNode(' '+part.name));element('p',part.explanation,card);const sl=element('label','相対配分（1〜100）',card),share=document.createElement('input');share.type='number';share.min=1;share.max=100;share.step=1;share.value=cards.length===0?3:1;sl.append(share);const st=element('label','感度 ',card),value=element('output','100%',st),strength=document.createElement('input');strength.type='range';strength.min=50;strength.max=150;strength.step=1;strength.value=100;st.append(strength);strength.addEventListener('input',()=>value.textContent=strength.value+'%');function toggle(){share.disabled=strength.disabled=!on.checked}on.addEventListener('change',toggle);toggle();cards.push({part,on,share,strength})}$('preview').disabled=false;$('status').textContent='準備完了。パーツを選んで、組み立ててみよう。'}catch(e){$('status').textContent=e.message}})();
</script></html>
